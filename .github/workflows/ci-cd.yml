# NAATALVOTE — Pipeline CI/CD backend (Spring Boot 4.1 / Java 17)
# Mode retenu : intégration continue + livraison continue avec validation manuelle
# avant production (environnement GitHub "production" protégé par approbation).
name: backend-ci-cd

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Livrer explicitement le commit main validé sur Render"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/naatalvote-backend

jobs:
  build-test:
    name: Build + tests (Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compilation et tests automatisés (unitaires + intégration)
        run: mvn -B -ntp verify -Dapi.version=1.44
      - name: Inventaire résolu des dépendances Maven
        run: mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DoutputFormat=json -DincludeTestScope=false
      - name: Vérification du contrôle des dépendances
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Audit bloquant des dépendances Maven (OSV)
        run: python3 scripts/audit_dependencies.py
      - name: Tests de l'orchestrateur de l'agent de revue
        run: python3 -m unittest discover -s agents/tests -v
      - name: Publication des rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.sha }}
          path: |
            **/target/surefire-reports/*
            target/bom.json
            target/dependency-audit.json
          retention-days: 30

  image:
    permissions:
      contents: read
      packages: write
    name: Image Docker versionnée (GHCR)
    needs: build-test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construction et publication de l'image (tag = SHA du commit)
        run: |
          docker build --build-arg BUILD_SHA="$GITHUB_SHA" -t "$IMAGE_NAME:${GITHUB_SHA}" -t "$IMAGE_NAME:latest" .
          docker push "$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$IMAGE_NAME:latest"
          echo "Image publiée : $IMAGE_NAME:${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Déploiement Render (après approbation)
    needs: image
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production          # approbation manuelle configurée dans Settings > Environments
      url: ${{ vars.BACKEND_URL }}
    steps:
      - name: Déclenchement du déploiement Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK" || { echo "Secret RENDER_DEPLOY_HOOK_BACKEND absent"; exit 1; }
          curl -fsS -X POST --get --data-urlencode "imgURL=$IMAGE_NAME:${GITHUB_SHA}" "$RENDER_DEPLOY_HOOK" > /dev/null
          echo "Déploiement demandé pour le commit ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
      - name: Test de bon fonctionnement après déploiement (health check)
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BACKEND_URL/api/v1/health" || true)
            echo "Tentative $i : HTTP $code"
            if [ "$code" = "200" ] && curl -fsS "$BACKEND_URL/api/v1/health" | python3 -c 'import json,sys,os; assert json.load(sys.stdin)["version"] == os.environ["GITHUB_SHA"]'; then
              echo "Version ${GITHUB_SHA} vérifiée" >> "$GITHUB_STEP_SUMMARY"; exit 0
            fi
            sleep 20
          done
          echo "Le service ne répond pas : appliquer la procédure de retour arrière (Rollback Render)."
          exit 1
