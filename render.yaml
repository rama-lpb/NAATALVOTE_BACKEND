services:
  - type: web
    name: naatalvote-backend
    env: docker
    rootDir: .
    dockerfilePath: Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATA_REDIS_HOST
        sync: false
      - key: SPRING_DATA_REDIS_PORT
        value: "6379"
      - key: NAATALVOTE_CORS_ALLOWED_ORIGINS
        sync: false
      # Production : ne jamais renvoyer l'OTP au client (valeur par défaut = true en dev)
      - key: NAATALVOTE_DEBUG_OTP
        value: "false"
      # URL du registre AppDAFF ; si absente, repli sur les fixtures embarquées
      - key: APPDAFF_BASE_URL
        sync: false
