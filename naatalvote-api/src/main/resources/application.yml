server:
  # Render exposes the port via $PORT. Default to 8080 for local/dev & Docker.
  port: ${PORT:8080}

spring:
  application:
    name: naatalvote-api
  profiles:
    default: inmemory
  jackson:
    time-zone: Africa/Dakar

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api/v1/docs
  swagger-ui:
    path: /api/v1/swagger

naatalvote:
  cors:
    # Comma-separated list. Override in Render via env var NAATALVOTE_CORS_ALLOWED_ORIGINS.
    allowed-origins: ${NAATALVOTE_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  auth:
    # Démonstration uniquement : renvoie l'OTP dans la réponse de login (aucune passerelle SMS).
    # Désactivé par défaut depuis l'audit E221 ; à activer explicitement (NAATALVOTE_DEBUG_OTP=true) en local.
    debug-return-otp: ${NAATALVOTE_DEBUG_OTP:false}
  jwt:
    # Clés RSA PEM (facultatives) ; sinon paire éphémère générée au démarrage.
    private-key: ${NAATALVOTE_JWT_PRIVATE_KEY:}
    public-key: ${NAATALVOTE_JWT_PUBLIC_KEY:}

appdaff:
  # Base URL of the external registry (simulation) used to fetch citizen data by CNI.
  base-url: ${APPDAFF_BASE_URL:http://localhost:9090}
